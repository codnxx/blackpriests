<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>성수와 오염수를 분리하자</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #1a1a1a 0%, #2e2e2e 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #e0e0e0;
    user-select: none;
  }
  .container { text-align: center; }
  h1 {
    font-size: 1.8rem;
    margin-bottom: 2rem;
    letter-spacing: 0.05em;
    color: #d4d4d4;
  }
  .tubes {
    display: flex;
    justify-content: center;
    gap: 22px;
    padding: 20px;
  }
  .tube {
    width: 60px;
    height: 240px;
    border: 4px solid #888;
    border-top: none;
    border-radius: 0 0 28px 28px;
    background: rgba(255, 255, 255, 0.03);
    display: flex;
    flex-direction: column-reverse;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.25s ease, border-color 0.25s ease;
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.4);
  }
  .tube:hover {
    border-color: #b0b0b0;
  }
  .tube.selected {
    transform: translateY(-18px);
    border-color: #f0f0f0;
    box-shadow: 0 10px 24px rgba(255, 255, 255, 0.1);
  }
  .layer {
    width: 100%;
    height: 25%;
    transition: background-color 0.2s ease;
  }
  .color-0 { background: #c0392b; }
  .color-1 { background: #7d3c98; }
  .color-2 { background: #d4ac0d; }
  .color-3 { background: #2e86c1; }
  .win {
    margin-top: 2rem;
    font-size: 1.1rem;
    color: #d4d4d4;
    opacity: 0;
    transition: opacity 0.3s;
    height: 1.5rem;
  }
  .win.show { opacity: 1; }
</style>
</head>
<body>
  <div class="container">
    <h1>성수와 오염수를 분리하자</h1>
    <div class="tubes" id="tubes"></div>
    <div class="win" id="win">완성!</div>
  </div>

<script>
  const CAPACITY = 4;
  const COLORS = 4;
  const EMPTY_TUBES = 2;

  let tubes = [];
  let selected = null;

  function init() {
    do {
      const pool = [];
      for (let c = 0; c < COLORS; c++) {
        for (let i = 0; i < CAPACITY; i++) pool.push(c);
      }
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
      tubes = [];
      for (let t = 0; t < COLORS; t++) {
        tubes.push(pool.slice(t * CAPACITY, (t + 1) * CAPACITY));
      }
      for (let e = 0; e < EMPTY_TUBES; e++) tubes.push([]);
    } while (isWin());
    selected = null;
  }

  function render() {
    const container = document.getElementById('tubes');
    container.innerHTML = '';
    tubes.forEach((tube, idx) => {
      const div = document.createElement('div');
      div.className = 'tube' + (selected === idx ? ' selected' : '');
      tube.forEach(color => {
        const layer = document.createElement('div');
        layer.className = 'layer color-' + color;
        div.appendChild(layer);
      });
      div.addEventListener('click', () => tubeClick(idx));
      container.appendChild(div);
    });
    document.getElementById('win').classList.toggle('show', isWin());
  }

  function tubeClick(idx) {
    if (selected === null) {
      if (tubes[idx].length > 0) selected = idx;
    } else if (selected === idx) {
      selected = null;
    } else {
      pour(selected, idx);
      selected = null;
    }
    render();
  }

  function pour(from, to) {
    const src = tubes[from], dst = tubes[to];
    if (src.length === 0 || dst.length >= CAPACITY) return;
    const topColor = src[src.length - 1];
    if (dst.length > 0 && dst[dst.length - 1] !== topColor) return;
    let count = 0;
    for (let i = src.length - 1; i >= 0 && src[i] === topColor; i--) count++;
    const move = Math.min(count, CAPACITY - dst.length);
    for (let i = 0; i < move; i++) dst.push(src.pop());
  }

  function isWin() {
    return tubes.every(t =>
      t.length === 0 || (t.length === CAPACITY && t.every(c => c === t[0]))
    );
  }

  init();
  render();
</script>
</body>
</html>
